<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="上海方言主题 2048 小游戏 - 用上海话方言词汇替代传统数字，趣味休闲" />
    <meta name="theme-color" content="#faf6f0" />
    <title>方言 2048 - 上海话版</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <!-- 引入思源黑体（使用 CN 域名优化加载速度） -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 游戏主容器 -->
    <div class="game-container">

      <!-- 顶部：标题 + 分数 -->
      <div class="header">
        <h1 class="game-title">方言 2048</h1>
        <div class="scores">
          <!-- 当前分数 -->
          <div class="score-box">
            <div class="label">分数</div>
            <div class="value" id="score-value">0</div>
          </div>
          <!-- 最高分 -->
          <div class="score-box">
            <div class="label">最高</div>
            <div class="value" id="best-value">0</div>
          </div>
        </div>
      </div>

      <!-- 副标题：说明 + 操作按钮（语音开关、新游戏） -->
      <div class="sub-header">
        <p class="game-desc">合并相同方言，挑战<strong>老灵诶</strong>！</p>
        <div class="sub-actions">
          <!-- 语音开关按钮：默认关闭（静音），由玩家主动点击开启 -->
          <!-- 两套 SVG 图标：静音态（喇叭+斜杠）/ 开启态（喇叭+声波） -->
          <button
            class="btn-sound sound-off"
            id="btn-sound"
            type="button"
            aria-label="开启语音"
            aria-pressed="false"
            title="语音开关"
          >
            <!-- 开启态图标（声音波） -->
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <!-- 关闭态图标（静音斜杠） -->
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.59 2 2.7-2.7-1.42-1.41L15.18 10.6 12.47 7.9l-1.42 1.41 2.71 2.71-2.71 2.71 1.42 1.41 2.71-2.7 2.69 2.7 1.42-1.41-2.7-2.71z"/>
            </svg>
          </button>
          <!-- 新游戏按钮 -->
          <button class="btn-new-game" id="btn-new-game" type="button">新游戏</button>
        </div>
      </div>

      <!-- 棋盘区域 -->
      <div class="board-wrapper" id="board-wrapper">
        <!-- 底层网格（4x4 空格子背景） -->
        <div class="grid-bg">
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <!-- 方块层（动态生成方块 DOM） -->
        <div class="tile-layer" id="tile-layer"></div>

        <!-- 游戏结束 / 胜利弹窗 -->
        <div class="game-message" id="game-message">
          <div class="msg-text" id="msg-text">游戏结束</div>
          <button class="btn-retry" id="btn-retry">再来一局</button>
        </div>
      </div>

      <!-- 方言对照表 -->
      <div class="legend">
        <div class="legend-item"><div class="dialect-word">港都</div><div>= 2</div></div>
        <div class="legend-item"><div class="dialect-word">小瘪三</div><div>= 4</div></div>
        <div class="legend-item"><div class="dialect-word">小赤佬</div><div>= 8</div></div>
        <div class="legend-item"><div class="dialect-word">乡毋宁</div><div>= 16</div></div>
        <div class="legend-item"><div class="dialect-word">小宗桑</div><div>= 32</div></div>
        <div class="legend-item"><div class="dialect-word">老宗桑</div><div>= 64</div></div>
        <div class="legend-item"><div class="dialect-word">sasandi</div><div>= 128</div></div>
        <div class="legend-item"><div class="dialect-word">老屈诶</div><div>= 256</div></div>
        <div class="legend-item"><div class="dialect-word">老家诶</div><div>= 512</div></div>
        <div class="legend-item"><div class="dialect-word">老灵诶</div><div>= 1024</div></div>
      </div>

      <!-- 底部操作说明 -->
      <div class="footer">
        <strong>操作方式：</strong>键盘方向键 / WASD / 触屏滑动<br />
        合并相同方言词汇，合成<strong>老灵诶 (1024)</strong> 即为胜利！
      </div>

    </div>

    <!-- ============================================
         方言语音资源（原生 audio 标签）
         每个 data-value 与方块数值一一绑定；
         preload="auto" 提示浏览器预加载，静音关闭时也不自动播放。
         加载失败由 game.js 做容错，不阻塞游戏。
         ============================================ -->
    <div id="audio-pool" class="audio-pool" aria-hidden="true">
      <audio class="game-audio" data-value="2"    src="/audio/tile-2.mp3"    preload="auto"></audio>
      <audio class="game-audio" data-value="4"    src="/audio/tile-4.mp3"    preload="auto"></audio>
      <audio class="game-audio" data-value="8"    src="/audio/tile-8.mp3"    preload="auto"></audio>
      <audio class="game-audio" data-value="16"   src="/audio/tile-16.mp3"   preload="auto"></audio>
      <audio class="game-audio" data-value="32"   src="/audio/tile-32.mp3"   preload="auto"></audio>
      <audio class="game-audio" data-value="64"   src="/audio/tile-64.mp3"   preload="auto"></audio>
      <audio class="game-audio" data-value="128"  src="/audio/tile-128.mp3"  preload="auto"></audio>
      <audio class="game-audio" data-value="256"  src="/audio/tile-256.mp3"  preload="auto"></audio>
      <audio class="game-audio" data-value="512"  src="/audio/tile-512.mp3"  preload="auto"></audio>
      <audio class="game-audio" data-value="1024" src="/audio/tile-1024.mp3" preload="auto"></audio>
    </div>

    <!-- 引入游戏逻辑 -->
    <script src="/scripts/game.js"></script>
  </body>
</html>
